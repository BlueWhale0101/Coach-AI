    },
    "/search-events": {
      "post": {
        "operationId": "searchEvents",
        "summary": "Search fitness events by keyword, type, review flag, and optional date range.",
        "description": "Use for fuzzy recall: find HYROX workouts, eggs, low energy, or records needing review.",
        "security": [
          {
            "ActionSecret": []
          }
        ],
        "requestBody": {
          "required": true,
